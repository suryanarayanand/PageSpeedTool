name: Daily PageSpeed reports

'on':
  workflow_dispatch:
    inputs:
      article_count:
        description: Articles per publication
        required: true
        default: 1
        type: number
      publications:
        description: Publications, comma-separated (TH, BL, SS)
        required: true
        default: TH,BL,SS
        type: string
      devices:
        description: Devices
        default: both
        type: choice
        options: [both, mobile, desktop]
      collector:
        description: Auto uses the API when a key exists, otherwise a headless cloud browser
        default: auto
        type: choice
        options: [auto, api, browser]
      run_audit:
        description: Collect new measurements (disable to publish existing history only)
        default: true
        type: boolean
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read

concurrency:
  group: pagespeed-daily-history
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || vars.PAGESPEED_DAILY_ENABLED != 'false')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 360
    permissions:
      contents: write
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    env:
      PAGESPEED_DATA_DIR: ${{ github.workspace }}/.pagespeed-data
      PAGESPEED_CLOUD: '1'
      PAGESPEED_HEADLESS: '1'
      PAGESPEED_BROWSER_CHANNEL: chromium
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
      CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
      ARTICLE_COUNT: ${{ (github.event_name == 'workflow_dispatch' && format('{0}', inputs.article_count)) || vars.PAGESPEED_ARTICLES_PER_PUBLICATION || '1' }}
      PUBLICATIONS: ${{ inputs.publications || vars.PAGESPEED_PUBLICATIONS || 'TH,BL,SS' }}
      DEVICES: ${{ inputs.devices || vars.PAGESPEED_DEVICES || 'both' }}
      COLLECTOR: ${{ inputs.collector || vars.PAGESPEED_COLLECTOR || 'auto' }}
    steps:
      - name: Check out the application
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify the application
        env:
          PAGESPEED_CLOUD: '0'
          PAGESPEED_DATA_DIR: ${{ github.workspace }}
          PAGESPEED_API_KEY: ''
          CRUX_API_KEY: ''
        run: python -m unittest discover -s . -p 'test_*.py'
      - name: Restore previous days
        run: python pages_history.py restore
      - name: Install cloud browser when needed
        if: >-
          (github.event_name != 'workflow_dispatch' || inputs.run_audit) &&
          (env.COLLECTOR == 'browser' || (env.COLLECTOR == 'auto' && env.PAGESPEED_API_KEY == ''))
        run: python -m playwright install --with-deps chromium
      - name: Run the selected article count
        if: github.event_name != 'workflow_dispatch' || inputs.run_audit
        run: python cloud_audit.py
      - name: Preserve dated report history
        run: python pages_history.py push
      - name: Build the public portal
        run: python publish_static.py _site --repository "$GITHUB_REPOSITORY"
      - name: Upload the report site
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the report portal
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Remove the temporary deployment artifact
        if: success() && needs.build.outputs.artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
